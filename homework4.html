<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Page</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <h1>Responsive Gallery</h1>
    </header>
    <main class="grid-container">
        <figure>
            <img src="https://picsum.photos/id/10/400/300" alt="Forest view with misty trees">
            <figcaption>Explore the dense, misty mountain forest in morning fog.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/20/400/300" alt="Desk workspace with computer and notebook">
            <figcaption>A cozy study corner equipped with modern tools for work.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/30/400/300" alt="Ocean coast with waves crashing against rocks">
            <figcaption>Serene ocean waves crashing gently along the rocky shoreline.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/40/400/300" alt="Serene view of a lake during sunset">
            <figcaption>Tranquil evening scene by the water with glowing sky reflections.</figcaption>
        </figure>
        <figure>
            <img src="https://picsum.photos/id/50/400/300" alt="Architectural design of a modern building facade">
            <figcaption>Contemporary urban architectural structures showcasing unique geometric shapes.</figcaption>
        </figure>
    </main>
</body>
</html>
